custom_proxy_group=♻️ 美国自动`url-test`(?=.*(美|US|USA|(?i)United States|(?i)America))^((?!(港|台|韩|日|新)).)*$`http://www.gstatic.com/generate_204`180,,20

custom_proxy_group=♻️ 台湾自动`url-test`(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|日|新|美)).)*$`http://www.gstatic.com/generate_204`180,,20

custom_proxy_group=♻️ 韩国自动`url-test`(?=.*(韩|KR|(?i)Korea))^((?!(港|台|日|新|美)).)*$`http://www.gstatic.com/generate_204`180,,20

custom_proxy_group=♻️ 新加坡自动`url-test`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|美)).)*$`http://www.gstatic.com/generate_204`180,,20

custom_proxy_group=♻️ 自动选择`url-test`^((?!(DIRECT)).)*$`http://www.gstatic.com/generate_204`180,,20

