; 地区选择组
custom_proxy_group=🇭🇰 香港节点`select`(港|HK|(?i)Hong)^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=🇯🇵 日本节点`select`(日|JP|(?i)Japan)^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=🇸🇬 狮城节点`select`(新加坡|坡|狮城|SG|Singapore)^((?!(台|日|韩|深|美)).)*$

; 故障转移
custom_proxy_group=🔯 香港故转`fallback`(港|HK|(?i)Hong)^((?!(台|日|韩|新|深|美)).)*$`https://www.gstatic.com/generate_204`180
custom_proxy_group=🔯 日本故转`fallback`(日|JP|(?i)Japan)^((?!(港|台|韩|新|美)).)*$`https://www.gstatic.com/generate_204`180
custom_proxy_group=🔯 狮城故转`fallback`(新加坡|坡|狮城|SG|Singapore)^((?!(台|日|韩|深|美)).)*$`https://www.gstatic.com/generate_204`180

; 自动测速
custom_proxy_group=♻️ 香港自动`url-test`(港|HK|(?i)Hong)^((?!(台|日|韩|新|深|美)).)*$`https://www.gstatic.com/generate_204`180,20
custom_proxy_group=♻️ 日本自动`url-test`(日|JP|(?i)Japan)^((?!(港|台|韩|新|美)).)*$`https://www.gstatic.com/generate_204`180,20
custom_proxy_group=♻️ 美国自动`url-test`(美|US|USA|(?i)United States|(?i)America)^((?!(港|台|韩|日|新)).)*$`https://www.gstatic.com/generate_204`180,20
custom_proxy_group=♻️ 台湾自动`url-test`(台|TW|(?i)Taiwan)^((?!(港|韩|日|新|美)).)*$`https://www.gstatic.com/generate_204`180,20
custom_proxy_group=♻️ 韩国自动`url-test`(韩|KR|(?i)Korea)^((?!(港|台|日|新|美)).)*$`https://www.gstatic.com/generate_204`180,20
custom_proxy_group=♻️ 新加坡自动`url-test`(新加坡|坡|狮城|SG|Singapore)^((?!(港|台|韩|日|美)).)*$`https://www.gstatic.com/generate_204`180,20
custom_proxy_group=♻️ 自动选择`url-test`^((?!(直连)).)*$`https://www.gstatic.com/generate_204`180,20

; 手动节点 + 直连
custom_proxy_group=🌐 手动节点`select`.*
custom_proxy_group=直连`select`[]DIRECT

; 固定参数
enable_rule_generator=true
overwrite_original_rules=true
