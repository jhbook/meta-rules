; =========================================================
; 地区节点
; =========================================================

custom_proxy_group=🇭🇰 香港节点`select`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$

custom_proxy_group=🇯🇵 日本节点`select`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$

custom_proxy_group=🇸🇬 狮城节点`select`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$


; =========================================================
; 故障转移
; =========================================================

custom_proxy_group=🔯 香港故转`fallback`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`http://www.gstatic.com/generate_204`180

custom_proxy_group=🔯 日本故转`fallback`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`180

custom_proxy_group=🔯 狮城故转`fallback`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$`http://www.gstatic.com/generate_204`180


