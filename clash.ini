; 全局自动选择
custom_proxy_group=♻️ 自动选择`url-test`^((?!(直连)).)*$`https://www.gstatic.com/generate_204`180,20

; 手动节点 + 直连
custom_proxy_group=🌐 手动节点`select`.*
custom_proxy_group=直连`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
