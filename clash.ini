custom_proxy_group=🚀 默认代理`select`[]♻️ 自动选择`[]🔯 香港故转`[]🔯 日本故转`[]🔯 狮城故转`[]♻️ 美国自动`[]♻️ 台湾自动`[]♻️ 韩国自动`[]♻️ 香港自动`[]♻️ 日本自动`[]♻️ 新加坡自动`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🌐 手动节点`[]直连

