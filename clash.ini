[custom]

; ========== 规则集（严格按原YAML rules顺序） ==========

; 1. 私有IP/域名 → 直连
ruleset=直连,[]GEOIP,private,no-resolve
ruleset=直连,[]GEOSITE,private

; 2. 自定义直连/代理列表
ruleset=直连,clash-classic:https://raw.githubusercontent.com/jhbook/meta-rules/refs/heads/main/direct.list
ruleset=🚀 默认代理,clash-classic:https://raw.githubusercontent.com/jhbook/meta-rules/refs/heads/main/proxy.list

; 3. Steam国内 → 直连
ruleset=直连,[]GEOSITE,steam@cn

; 4. AI相关 → ChatGPT组
ruleset=🤖 ChatGPT,[]GEOSITE,category-ai-!cn

; 5. GitHub
ruleset=👨🏻‍💻 GitHub,[]GEOSITE,github

; 6. OneDrive
ruleset=🐬 OneDrive,[]GEOSITE,onedrive

; 7. Microsoft / Apple → 直连
ruleset=直连,[]GEOSITE,microsoft
ruleset=直连,[]GEOSITE,apple

; 8. YouTube
ruleset=📹 YouTube,[]GEOSITE,youtube

; 9. Speedtest → 直连
ruleset=直连,[]GEOSITE,ookla-speedtest

; 10. Google
ruleset=🍀 Google,[]GEOSITE,google

; 11. Netflix
ruleset=🎥 NETFLIX,[]GEOSITE,netflix

; 12. TikTok
ruleset=🎵 TikTok,[]GEOSITE,tiktok

; 13. PayPal
ruleset=💶 PayPal,[]GEOSITE,paypal

; 14. Telegram
ruleset=📲 Telegram,[]GEOSITE,telegram

; 15. 国内域名 + 国内IP → 直连
ruleset=直连,[]GEOSITE,cn
ruleset=直连,[]GEOIP,cn,no-resolve

; 16. 非中国地理位置 → 默认代理
ruleset=🚀 默认代理,[]GEOSITE,geolocation-!cn

; 17. 漏网之鱼
ruleset=🐟 漏网之鱼,[]FINAL

